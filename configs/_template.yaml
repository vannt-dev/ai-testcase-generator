# =============================================================
# TEMPLATE CONFIG — copy this file to configs/<project_name>.yaml
# and fill it in to apply it to a new project.
# =============================================================

project_name: "Project name"
platform: [web]   # can be [web], [ios, android], or [web, ios, android]

# Test case ID format; {MODULE} and {NUMBER} are filled in by the AI
test_id_format: "TC_{MODULE}_{NUMBER}"

# Test case types that must be considered when generating
test_types_required:
  - positive
  - negative
  - edge_case
  - ui_ux
  - compatibility

# Project-specific business rules — the more detailed, the more accurate
# the AI's generated cases will be, reducing the need for rework
domain_rules:
  - "Example: phone numbers have 10 digits and start with 0"
  - "Example: password must be at least 8 characters, with 1 uppercase letter and 1 digit"

# Explain system-specific terminology so the AI understands the context correctly
glossary:
  Example_term: "Explanation of its meaning"

# Additional notes (optional) — any other context you want the AI to know
notes: ""
