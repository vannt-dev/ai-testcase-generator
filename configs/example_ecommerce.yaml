project_name: "E-commerce App Demo"
platform: [web, ios, android]

test_id_format: "TC_{MODULE}_{NUMBER}"

test_types_required:
  - positive
  - negative
  - edge_case
  - ui_ux
  - compatibility
  - security

domain_rules:
  - "VN phone number: 10 digits, starts with 0"
  - "Price is displayed as: 1,000,000 VND"
  - "Session expires after 30 minutes of inactivity"
  - "Password: minimum 8 characters, at least 1 uppercase letter, 1 digit, 1 special character"
  - "Cart holds at most 50 distinct products"

glossary:
  SKU: "Product identifier code"
  Voucher: "Discount code, applied based on order conditions"
  Flash_sale: "Time-limited discount campaign"

notes: "Prioritize thorough testing of the checkout flow and voucher application since this is the core business flow."
